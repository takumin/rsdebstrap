---
name: CI
on:
  push:
    branches:
    - main
    tags:
    - 'v*'
  pull_request:
permissions: {}
jobs:
  ##############################################################################
  # Format
  ##############################################################################
  format:
    name: Format
    permissions:
      contents: read
    uses: ./.github/workflows/wc-format.yml
  ##############################################################################
  # Reviewdog
  ##############################################################################
  reviewdog:
    name: Reviewdog
    permissions:
      actions: read
      checks: write
      contents: read
      pull-requests: write
    uses: ./.github/workflows/wc-reviewdog.yml
  ##############################################################################
  # Fetch
  ##############################################################################
  fetch:
    name: Fetch
    permissions:
      contents: read
    uses: ./.github/workflows/wc-fetch.yml
  ##############################################################################
  # Test
  ##############################################################################
  test:
    name: Test
    permissions:
      contents: read
    uses: ./.github/workflows/wc-test.yml
  ##############################################################################
  # Coverage
  ##############################################################################
  # Informational only (see #732): reports a coverage number for visibility but
  # is intentionally left out of the `release` and `ci` gates below, so it never
  # blocks a merge or release. Test correctness is already gated by `test`.
  coverage:
    name: Coverage
    permissions:
      contents: read
      actions: read
      pull-requests: write
    uses: ./.github/workflows/wc-coverage.yml
  ##############################################################################
  # Verify
  ##############################################################################
  # Formal verification (Verus for the domain layer, Kani for the infrastructure
  # layer). Informational only, and left out of the `release` and `ci` gates
  # below for the same reason as `coverage`: both jobs install a toolchain from
  # outside the aqua pin set at job time, so an upstream outage must not block a
  # merge. The properties they prove are also checked — over a finite witness
  # domain — by `test`, which is gating. See docs/FORMAL_METHODS.md.
  verify:
    name: Verify
    permissions:
      contents: read
    uses: ./.github/workflows/wc-verify.yml
  ##############################################################################
  # Audit
  ##############################################################################
  audit:
    name: Audit
    permissions:
      contents: read
    uses: ./.github/workflows/wc-audit.yml
  ##############################################################################
  # Doc
  ##############################################################################
  doc:
    name: Doc
    permissions:
      contents: read
    uses: ./.github/workflows/wc-doc.yml
  ##############################################################################
  # Build
  ##############################################################################
  build:
    name: Build
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/wc-build.yml
  ##############################################################################
  # Release
  ##############################################################################
  release:
    needs:
    - format
    - reviewdog
    - test
    - audit
    - doc
    - build
    name: Release
    permissions:
      contents: write
    uses: ./.github/workflows/wc-release.yml
  ##############################################################################
  # Status Check
  ##############################################################################
  ci:
    needs:
    - format
    - reviewdog
    - fetch
    - test
    - audit
    - doc
    - build
    - release
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 3
    if: ${{ failure() || cancelled() }}
    steps:
    - name: Failure Status
      run: exit 1
