---
name: Fetch
on:
  workflow_call:
permissions: {}
defaults:
  run:
    shell: bash -euo pipefail {0}
concurrency:
  group: fetch-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  fetch:
    name: Fetch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        sparse-checkout: |-
          .aqua
          .github/workflows
          src
          tasks
    - name: Restore aqua cache
      id: aqua-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        key: aqua-fetch-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.aqua/**/*.yaml', '.github/workflows/*.yml') }}
        restore-keys: |-
          aqua-fetch-${{ runner.os }}-${{ runner.arch }}-
        path: ~/.local/share/aquaproj-aqua/
    - name: Setup aqua
      uses: aquaproj/aqua-installer@611554c6f0137ba41c8dd15aca8bee82504ea461 # v4.1.1
      with:
        aqua_version: v2.65.2
        # The cache key hashes the workflows that pin aqua_version, so only an
        # exact hit is known to hold this aqua; a prefix hit reinstalls it.
        skip_install_aqua: ${{ steps.aqua-cache.outputs.cache-hit == 'true' }}
    - name: Restore cargo deps cache
      id: deps-cache-restore
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        key: deps-${{ hashFiles('**/Cargo.lock') }}
        path: ~/.cargo/registry/
    - name: Restore rustup toolchain cache
      id: rustup-toolchain-cache-restore
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        key: rustup-${{ hashFiles('rust-toolchain.toml') }}
        path: ~/.rustup/
    - name: Install rust toolchain
      run: |-
        task tool:rustup:toolchain
    - name: Fetch cargo deps
      run: |-
        task tool:cargo:fetch
    - name: Save cargo deps cache
      if: github.ref == 'refs/heads/main' && steps.deps-cache-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        key: ${{ steps.deps-cache-restore.outputs.cache-primary-key }}
        path: ~/.cargo/registry/
    - name: Save rustup toolchain cache
      if: github.ref == 'refs/heads/main' && steps.rustup-toolchain-cache-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        key: ${{ steps.rustup-toolchain-cache-restore.outputs.cache-primary-key }}
        path: ~/.rustup/
    - name: Vacuum aqua packages
      if: github.ref == 'refs/heads/main' && steps.aqua-cache.outputs.cache-hit != 'true'
      run: task tool:aqua:vacuum
    - name: Save aqua cache
      if: github.ref == 'refs/heads/main' && steps.aqua-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        key: ${{ steps.aqua-cache.outputs.cache-primary-key }}
        path: ~/.local/share/aquaproj-aqua/
