---
name: Sign
on:
  workflow_call:
permissions: {}
defaults:
  run:
    shell: bash -euo pipefail {0}
concurrency:
  group: sign-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  sign:
    name: Sign
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        # Only aqua's config is needed. Cone mode would also check out the root
        # Taskfile.yml, whose vars run `cargo metadata` and, through
        # rust-toolchain.toml, install a toolchain this job never uses.
        sparse-checkout-cone-mode: false
        sparse-checkout: |-
          /.aqua/
    - name: Setup aqua
      uses: aquaproj/aqua-installer@611554c6f0137ba41c8dd15aca8bee82504ea461 # v4.1.1
      with:
        aqua_version: v2.65.2
    - name: Download artifact
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        path: dist
        pattern: rsdebstrap-release-*
        merge-multiple: true
    - name: Check artifacts
      run: tree --charset ASCII dist/
    # Renamed before signing so the attestation subjects and cosign bundles
    # carry the file names that are actually published.
    - name: Rename artifacts
      run: |-
        cd dist
        for f in ./*; do mv -n "$f" "${f/-release-/-}"; done
        sed -i -E 's/-release-/-/' ./*.sha256sum
    - name: Verify sha256sum
      run: |-
        cd dist
        for f in $(find . -type f -name '*.sha256sum' -printf '%f\n' | sort); do
          sha256sum -c "$f"
        done
    - name: Merge sha256sum
      run: |-
        cd dist
        echo -n > SHA256SUMS
        for f in $(find . -type f -name '*.sha256sum' -printf '%f\n' | sort); do
          < "$f" tee -a SHA256SUMS
          rm "$f"
        done
    - name: Verify sha256sums
      run: |-
        cd dist
        sha256sum -c SHA256SUMS
    - name: Generate artifact attestation
      if: ${{ !startsWith(github.event_name, 'pull') }}
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-path: 'dist/*'
    - name: Setup cosign
      if: ${{ !startsWith(github.event_name, 'pull') }}
      run: aqua install -t cosign
    - name: Generate code signing with cosign
      if: ${{ !startsWith(github.event_name, 'pull') }}
      run: |-
        cd dist
        for f in $(find . -type f -printf '%f\n' | sort); do
          cosign sign-blob "$f" -y --bundle "$f.sigstore.json"
        done
    - name: Check artifacts
      run: tree --charset ASCII dist/
    - name: Upload artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: release-artifacts
        path: dist/
