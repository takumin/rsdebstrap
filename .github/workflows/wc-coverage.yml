---
name: Coverage
on:
  workflow_call:
permissions: {}
concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  ##############################################################################
  # Coverage
  ##############################################################################
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # octocov posts a coverage comment on pull requests and reads/writes the
      # report from the GitHub Actions Artifacts datastore.
      actions: read
      pull-requests: write
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Setup aqua
      uses: aquaproj/aqua-installer@96a9bc20066c5bf5e275b41019cfc165b25f4e2e # v4.0.5
      with:
        aqua_version: v2.62.1
    - name: Restore cargo deps cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        key: deps-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |-
          deps-
        path: ~/.cargo/registry/
    - name: Restore rustup toolchain cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        key: rustup-${{ hashFiles('rust-toolchain.toml') }}
        restore-keys: |-
          rustup-
        path: ~/.rustup/
    - name: Setup coverage
      run: task setup:coverage
    - name: Coverage
      run: task coverage
    # Surface the per-file table and TOTAL line in the run's job summary for
    # at-a-glance visibility. `report` re-renders from the profdata the previous
    # step already collected (no recompile, no test re-run), so it is cheap. Its
    # default text output is exactly the per-file summary table (no line-by-line
    # detail), so no extra flag is needed.
    - name: Summary
      if: ${{ always() }}
      run: |-
        {
          echo '## Coverage'
          echo ''
          echo '```text'
          cargo llvm-cov report || echo '(coverage data unavailable)'
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
    # Render the LCOV report octocov consumes. Like the Summary step, this
    # re-renders from the profdata the Coverage step already collected — no
    # recompile, no test re-run — into octocov's default path.
    - name: Generate lcov
      run: |-
        mkdir -p coverage
        cargo llvm-cov report --lcov --output-path coverage/lcov.info
    - name: Setup octocov
      run: task tool:aqua:tag:octocov
    # octocov posts a coverage/code-to-test/exec-time comment on pull requests
    # and, on the default branch, publishes the report to the Actions Artifacts
    # datastore for aggregation by takumin/octocov-central. No acceptable
    # threshold is configured, so this stays informational (see #732).
    - name: Octocov
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: octocov
