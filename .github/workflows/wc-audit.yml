---
name: Audit
on:
  workflow_call:
permissions: {}
defaults:
  run:
    shell: bash -euo pipefail {0}
concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  audit:
    name: Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Restore aqua cache
      id: aqua-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        key: aqua-audit-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.aqua/**/*.yaml', '.github/workflows/*.yml') }}
        restore-keys: |-
          aqua-audit-${{ runner.os }}-${{ runner.arch }}-
        path: ~/.local/share/aquaproj-aqua/
    - name: Setup aqua
      uses: aquaproj/aqua-installer@611554c6f0137ba41c8dd15aca8bee82504ea461 # v4.1.1
      with:
        aqua_version: v2.65.2
        # The cache key hashes the workflows that pin aqua_version, so only an
        # exact hit is known to hold this aqua; a prefix hit reinstalls it.
        skip_install_aqua: ${{ steps.aqua-cache.outputs.cache-hit == 'true' }}
    - name: Restore cargo deps cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        key: deps-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |-
          deps-
        path: ~/.cargo/registry/
    - name: Restore rustup toolchain cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        key: rustup-${{ hashFiles('rust-toolchain.toml') }}
        restore-keys: |-
          rustup-
        path: ~/.rustup/
    # Policy (deterministic) and advisories (time-dependent) run as separate
    # steps rather than a single `task audit`. Both run on every PR and push to
    # main today, but keeping them split lets the advisory step be scoped
    # independently later — e.g. gated to dependency-changing PRs once declarative
    # path-filter tooling is in place — without disturbing the policy step.
    - name: Policy
      run: task audit:policy
    - name: Advisories
      run: task audit:advisories
    - name: Vacuum aqua packages
      if: github.ref == 'refs/heads/main' && steps.aqua-cache.outputs.cache-hit != 'true'
      run: task tool:aqua:vacuum
    - name: Save aqua cache
      if: github.ref == 'refs/heads/main' && steps.aqua-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        key: ${{ steps.aqua-cache.outputs.cache-primary-key }}
        path: ~/.local/share/aquaproj-aqua/
