---
name: Doc
on:
  workflow_call:
permissions: {}
defaults:
  run:
    shell: bash -euo pipefail {0}
env:
  CARGO_INCREMENTAL: '0'
  RUSTC_WRAPPER: ${{ !startsWith(github.ref, 'refs/tags/') && 'sccache' || '' }}
  SCCACHE_CACHE_SIZE: '1G'
  # cargo runs the RUSTC_WRAPPER from each crate's source dir, where aqua can't
  # find .aqua/aqua.yaml by upward search; point it at the repo config so the
  # `sccache` command resolves regardless of the working directory.
  AQUA_GLOBAL_CONFIG: ${{ github.workspace }}/.aqua/aqua.yaml
concurrency:
  group: doc-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  doc:
    name: Doc
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Restore aqua cache
      id: aqua-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        key: aqua-doc-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.aqua/**/*.yaml', '.github/workflows/*.yml') }}
        restore-keys: |-
          aqua-doc-${{ runner.os }}-${{ runner.arch }}-
        path: ~/.local/share/aquaproj-aqua/
    - name: Setup aqua
      uses: aquaproj/aqua-installer@611554c6f0137ba41c8dd15aca8bee82504ea461 # v4.1.1
      with:
        aqua_version: v2.65.2
        # The cache key hashes the workflows that pin aqua_version, so only an
        # exact hit is known to hold this aqua; a prefix hit reinstalls it.
        skip_install_aqua: ${{ steps.aqua-cache.outputs.cache-hit == 'true' }}
    - name: Restore cargo deps cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        key: deps-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |-
          deps-
        path: ~/.cargo/registry/
    - name: Restore sccache (deps)
      id: sccache
      if: ${{ !startsWith(github.ref, 'refs/tags/') }}
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        key: sccache-doc-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |-
          sccache-doc-
        path: ~/.cache/sccache
    - name: Restore rustup toolchain cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        key: rustup-${{ hashFiles('rust-toolchain.toml') }}
        restore-keys: |-
          rustup-
        path: ~/.rustup/
    - name: Setup sccache
      run: task tool:aqua:tag:sccache
    - name: Setup doc
      run: |-
        task setup:test
    - name: Doc
      run: |-
        task doc
    - name: sccache stats
      if: ${{ !startsWith(github.ref, 'refs/tags/') }}
      run: sccache --show-stats
    - name: Save sccache (deps)
      if: github.ref == 'refs/heads/main' && steps.sccache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        key: ${{ steps.sccache.outputs.cache-primary-key }}
        path: ~/.cache/sccache
    - name: Vacuum aqua packages
      if: github.ref == 'refs/heads/main' && steps.aqua-cache.outputs.cache-hit != 'true'
      run: task tool:aqua:vacuum
    - name: Save aqua cache
      if: github.ref == 'refs/heads/main' && steps.aqua-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        key: ${{ steps.aqua-cache.outputs.cache-primary-key }}
        path: ~/.local/share/aquaproj-aqua/
