---
# Comprehensive example profile for Debian Trixie
#
# This profile demonstrates all available features:
#   - defaults: isolation (chroot), privilege, mitamae
#   - bootstrap: mmdebstrap (debootstrap also available)
#   - pipeline: prepare (mount, apt, resolv_conf), provision (apt + shell + mitamae),
#     assemble (apt, machine_id, resolv_conf, output)

dir: /tmp/debian-trixie-server-amd64

# Default settings applied to all tasks unless overridden per-task
defaults:
  # Isolation backend for running commands inside the rootfs
  # Currently only 'chroot' is supported (bwrap/systemd-nspawn planned)
  isolation:
    type: chroot

  # Privilege escalation for commands that require root access, and for the helper
  # that modifies the rootfs. Required here because the bootstrap below runs privileged
  # (so the rootfs is root-owned) and because mounts are configured; it also escalates
  # mksquashfs for assemble.output.rootfs. Supported methods: sudo, doas
  privilege:
    method: sudo

  mitamae:
    binary:
      x86_64: /usr/local/bin/mitamae-x86_64-linux
      aarch64: /usr/local/bin/mitamae-aarch64-linux

# Supported types: mmdebstrap, debootstrap
#
# debootstrap alternative:
#   bootstrap:
#     type: debootstrap
#     suite: trixie
#     target: rootfs
#     mirror: https://deb.debian.org/debian
#     variant: minbase
#     arch: amd64
#     components: [main, contrib]
#     include: [curl, ca-certificates]
#     merged_usr: true
bootstrap:
  type: mmdebstrap
  suite: trixie
  target: rootfs # Directory output (required for pipeline tasks)
  mirrors:
  - https://deb.debian.org/debian
  variant: apt
  components:
  - main
  - contrib
  architectures:
  - amd64
  include:
  - curl
  - ca-certificates
  # A kernel and initramfs-tools for assemble.output.kernel/initramfs below
  - linux-image-amd64
  - initramfs-tools
  privilege: true # Use defaults.privilege method

# Prepare phase: filesystem mounts, extra APT sources and resolv.conf for the rootfs.
# Named-field form: each role is a single optional key (not a list).
# The pipeline always runs mount, then apt, then resolv_conf, regardless of key order.
prepare:
  mount:
    # Predefined mount set: proc, sysfs, devtmpfs, devpts, tmpfs(/tmp), tmpfs(/run)
    preset: recommends
    # Custom mount entries (override preset entries with the same target)
    # mounts:
    # - source: /dev
    #   target: /dev
    #   options: [bind]

  # Extra APT keyrings (/etc/apt/keyrings, created if missing), repositories
  # (deb822 files in /etc/apt/sources.list.d) and preferences
  # (/etc/apt/preferences.d). They stay in the final rootfs; assemble.apt below writes over
  # anything the image should not keep, such as a build mirror. An apt
  # provision task with `update: true` has to refresh the lists before installing from them.
  apt:
    # Debian's own repositories as deb822 files, signed by the keyring the bootstrap
    # installed. The security archive lives under a different URI, so it is a separate file.
    repositories:
    - name: debian
      uris: [https://deb.debian.org/debian]
      suites: [trixie, trixie-updates]
      components: [main, contrib]
      signed_by: /usr/share/keyrings/debian-archive-keyring.gpg
    - name: debian-security
      uris: [https://security.debian.org/debian-security]
      suites: [trixie-security]
      components: [main, contrib]
      signed_by: /usr/share/keyrings/debian-archive-keyring.gpg
    # Delete the bootstrap's /etc/apt/sources.list, so the `debian` repository above
    # replaces it instead of duplicating it.
    remove_sources_list: true
    # A third-party repository takes its keyring from `keyrings` and may be pinned:
    # keyrings:
    # - name: docker
    #   # Or `path: ./keys/docker.asc`, or inline `content: |`
    #   url: https://download.docker.com/linux/debian/gpg
    #   # sha256: <64 hex digits>  # Pin the downloaded key
    # repositories:
    # - name: docker
    #   uris: [https://download.docker.com/linux/debian]
    #   suites: [trixie]
    #   components: [stable]
    #   signed_by: docker
    # # apt_preferences(5) pins, one stanza each
    # preferences:
    # - name: docker
    #   pins:
    #   - packages: [containerd.io]
    #     pin: origin download.docker.com
    #     priority: 1001
    #     explanation: prefer Docker's build over Debian's

  # Copy host's /etc/resolv.conf into the chroot for DNS resolution.
  # Needed because the 'recommends' preset mounts tmpfs on /run,
  # which breaks the systemd symlink /etc/resolv.conf -> ../run/systemd/resolve/stub-resolv.conf
  #
  # Alternative: generate resolv.conf with explicit nameservers
  #   resolv_conf:
  #     name_servers: [8.8.8.8, 8.8.4.4]
  #     search: [example.com]
  resolv_conf:
    copy: true

provision:
# apt-get update, then apt-get install --no-install-recommends. `update` defaults
# to false; the first apt task needs it, since mmdebstrap removes the package lists.
- type: apt
  update: true
  install: [vim, htop]
  # recommends: true          # Install Recommends too

- type: shell
  content: |-
    #!/bin/sh
    set -e
    echo "provisioned by $(id -un)"
  # Per-task overrides (optional):
  #   privilege: false        # Disable privilege for this task
  #   privilege: { method: doas }  # Use a different method
  #   shell: /bin/bash        # Use a different shell
  # `isolation: false` runs the task directly on the host instead of in a chroot.
  # It is refused together with any resolved privilege — running a program from
  # inside the half-built rootfs as root hands it the host — so with the
  # `defaults.privilege` above it takes both lines:
  #   privilege: false
  #   isolation: false
  # External script alternative:
  #   script: ./scripts/setup.sh

# Mitamae provisioner with inline recipe
# Requires mitamae binary at the path specified in defaults.mitamae
# - type: mitamae
#   content: |-
#     package 'build-essential' do
#       action :install
#     end
#   binary: /path/to/mitamae  # Override defaults.mitamae for this task
#   External recipe alternative:
#     script: ./recipes/setup.rb

# Assemble phase: finalization after provisioning.
assemble:
  apt:
    # Empties apt's download cache and package lists, like `apt-get distclean`.
    dist_clean: true
    # Keyrings, repositories and preferences as in prepare.apt, for where the image should
    # differ from the build: each replaces a file of the same name, so this points the
    # image at the public mirror after building from another.
    # repositories:
    # - name: debian
    #   uris: [https://deb.debian.org/debian]
    #   suites: [trixie, trixie-updates]
    #   components: [main, contrib]

  # Resets /etc/machine-id so each machine booted from the image generates its
  # own ID. `empty` suits a read-only root; `uninitialized` instead makes the next
  # boot a first boot.
  machine_id: empty

  # Gives the final rootfs a permanent /etc/resolv.conf, replacing the temporary
  # one from the prepare phase. Recent Debian/Ubuntu default to the
  # systemd-resolved stub symlink, so restore it here:
  resolv_conf:
    link: ../run/systemd/resolve/stub-resolv.conf
    # OR, instead of link, generate a static file with explicit nameservers:
    # name_servers: [8.8.8.8, 8.8.4.4]
    # search: [example.com]

  # Build artifacts written into `dir` next to the rootfs, after the tasks above,
  # so they carry the final rootfs. Each `file` is a plain name in `dir`, except an
  # asset's, which may be a path below it.
  output:
    # Copied out of the rootfs through Debian's /vmlinuz link (then /boot/vmlinuz).
    # Set `source: /boot/vmlinuz-<version>` to pick a specific kernel.
    kernel:
      file: vmlinuz
    # Likewise through /initrd.img (then /boot/initrd.img); keeps its 0600 mode.
    initramfs:
      file: initrd.img
    # Other files to place in `dir`, such as a board's boot firmware. Each takes one of
    # `url` (https, with a required sha256), `path` (a host file), `content` (inline)
    # or `source` (a path in the rootfs). Missing directories are created.
    # assets:
    # - file: boot/start4.elf
    #   url: https://github.com/raspberrypi/firmware/raw/<commit>/boot/start4.elf
    #   sha256: <64 hex digits>
    # - file: boot/config.txt
    #   path: ./boot/config.txt
    # - file: boot/cmdline.txt
    #   content: "console=serial0,115200 root=/dev/mmcblk0p2 rootwait\n"
    # Packed with mksquashfs (must be on PATH), escalated with defaults.privilege.
    rootfs:
      file: rootfs.squashfs
      compression: zstd # gzip | lzo | lz4 | xz | zstd
