---
# Comprehensive example profile for Debian Trixie
#
# This profile demonstrates all available features:
#   - defaults: isolation (chroot), privilege, mitamae
#   - bootstrap: mmdebstrap (debootstrap also available)
#   - pipeline: prepare (mount, apt, resolv_conf), provision (shell + mitamae),
#     assemble (resolv_conf, output)

dir: /tmp/debian-trixie-server-amd64

# Default settings applied to all tasks unless overridden per-task
defaults:
  # Isolation backend for running commands inside the rootfs
  # Currently only 'chroot' is supported (bwrap/systemd-nspawn planned)
  isolation:
    type: chroot

  # Privilege escalation for commands that require root access
  # Required when mounts are configured. Supported methods: sudo, doas
  privilege:
    method: sudo

  mitamae:
    binary:
      x86_64: /usr/local/bin/mitamae-x86_64-linux
      aarch64: /usr/local/bin/mitamae-aarch64-linux

# Supported types: mmdebstrap, debootstrap
#
# debootstrap alternative:
#   bootstrap:
#     type: debootstrap
#     suite: trixie
#     target: rootfs
#     mirror: https://deb.debian.org/debian
#     variant: minbase
#     arch: amd64
#     components: [main, contrib]
#     include: [curl, ca-certificates]
#     merged_usr: true
bootstrap:
  type: mmdebstrap
  suite: trixie
  target: rootfs # Directory output (required for pipeline tasks)
  mirrors:
  - https://deb.debian.org/debian
  variant: apt
  components:
  - main
  - contrib
  architectures:
  - amd64
  include:
  - curl
  - ca-certificates
  # A kernel and initramfs-tools for assemble.output.kernel/initramfs below
  - linux-image-amd64
  - initramfs-tools
  privilege: true # Use defaults.privilege method

# Prepare phase: filesystem mounts and resolv.conf for the rootfs.
# Named-field form: each role is a single optional key (not a list).
# The pipeline always runs mount before resolv_conf, regardless of key order.
prepare:
  mount:
    # Predefined mount set: proc, sysfs, devtmpfs, devpts, tmpfs(/tmp), tmpfs(/run)
    preset: recommends
    # Custom mount entries (override preset entries with the same target)
    # mounts:
    # - source: /dev
    #   target: /dev
    #   options: [bind]

  # Extra APT keyrings (/etc/apt/keyrings, created if missing) and repositories
  # (deb822 files in /etc/apt/sources.list.d). Removed again before assemble
  # unless `keep: true`. A provision task still has to run `apt-get update`
  # before installing from them.
  # apt:
  #   keyrings:
  #   - name: docker
  #     # Or `path: ./keys/docker.asc`, or inline `content: |`
  #     url: https://download.docker.com/linux/debian/gpg
  #     # sha256: <64 hex digits>  # Pin the downloaded key
  #     keep: true
  #   repositories:
  #   - name: docker
  #     uris: [https://download.docker.com/linux/debian]
  #     suites: [trixie]
  #     components: [stable]
  #     signed_by: docker
  #     keep: true

  # Copy host's /etc/resolv.conf into the chroot for DNS resolution.
  # Needed because the 'recommends' preset mounts tmpfs on /run,
  # which breaks the systemd symlink /etc/resolv.conf -> ../run/systemd/resolve/stub-resolv.conf
  #
  # Alternative: generate resolv.conf with explicit nameservers
  #   resolv_conf:
  #     name_servers: [8.8.8.8, 8.8.4.4]
  #     search: [example.com]
  resolv_conf:
    copy: true

provision:
- type: shell
  content: |-
    #!/bin/sh
    set -e
    apt-get update
    apt-get install -y vim htop
  # Per-task overrides (optional):
  #   privilege: false        # Disable privilege for this task
  #   privilege: { method: doas }  # Use a different method
  #   shell: /bin/bash        # Use a different shell
  # `isolation: false` runs the task directly on the host instead of in a chroot.
  # It is refused together with any resolved privilege — running a program from
  # inside the half-built rootfs as root hands it the host — so with the
  # `defaults.privilege` above it takes both lines:
  #   privilege: false
  #   isolation: false
  # External script alternative:
  #   script: ./scripts/setup.sh

# Mitamae provisioner with inline recipe
# Requires mitamae binary at the path specified in defaults.mitamae
# - type: mitamae
#   content: |-
#     package 'build-essential' do
#       action :install
#     end
#   binary: /path/to/mitamae  # Override defaults.mitamae for this task
#   External recipe alternative:
#     script: ./recipes/setup.rb

- type: shell
  content: |-
    #!/bin/sh
    set -e
    apt-get clean
    rm -rf /var/lib/apt/lists/*
    echo "Cleanup complete"

# Assemble phase: finalization after provisioning. The resolv_conf task gives
# the final rootfs a permanent /etc/resolv.conf, replacing the temporary one
# from the prepare phase. Recent Debian/Ubuntu default to the systemd-resolved
# stub symlink, so restore it here:
assemble:
  resolv_conf:
    link: ../run/systemd/resolve/stub-resolv.conf
    # OR, instead of link, generate a static file with explicit nameservers:
    # name_servers: [8.8.8.8, 8.8.4.4]
    # search: [example.com]

  # Build artifacts written into `dir` next to the rootfs, after the tasks above,
  # so they carry the final rootfs. Each `file` is a plain name in `dir`.
  output:
    # Copied out of the rootfs through Debian's /vmlinuz link (then /boot/vmlinuz).
    # Set `source: /boot/vmlinuz-<version>` to pick a specific kernel.
    kernel:
      file: vmlinuz
    # Likewise through /initrd.img (then /boot/initrd.img); keeps its 0600 mode.
    initramfs:
      file: initrd.img
    # Packed with mksquashfs (must be on PATH), escalated with defaults.privilege.
    rootfs:
      file: rootfs.squashfs
      compression: zstd # gzip | lzo | lz4 | xz | zstd
