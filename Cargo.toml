[package]
name = "rsdebstrap"
authors = ["Takumi Takahashi <takumiiinn@gmail.com>"]
description = "A declarative CLI tool to build Debian-based rootfs images using mmdebstrap and YAML manifests"
license = "Apache-2.0"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
readme = "README.md"
# Distribution is via GitHub Releases (signed binaries), not crates.io. The publish
# metadata below (description/keywords/categories/homepage/repository) is retained for
# the crate's identity, but publishing to crates.io is intentionally disabled for now so
# `cargo publish` can never ship 0.1.0 by accident. Flip this to enable it. (#740)
publish = false
homepage = "https://github.com/takumin/rsdebstrap"
repository = "https://github.com/takumin/rsdebstrap"
keywords = ["debian", "ubuntu", "debootstrap", "mmdebstrap", "rootfs"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0.98"
# Carries the helper protocol's file payloads. JSON has no binary type, and serde_json
# renders a `Vec<u8>` as a decimal array — 4.6 bytes of text per byte of file.
base64 = "0.23.0"
camino = { version = "1.1.9", features = ["serde1"] }
# Evaluates a provision task's `when:` condition. The default features (regex, chrono,
# base64 encoders) back CEL functions a condition over string variables does not need.
cel = { version = "0.15.0", default-features = false }
clap = { version = "4.5.37", features = ["derive"] }
clap_complete = "4.5.65"
# Decompresses a mitamae plugin given as a `.tar.gz` archive by `url`.
flate2 = "1.1.10"
# The `md5` algorithm a profile's `checksum:` pin may name, alongside `sha1` and `sha2`.
md-5 = "0.11.0"
rustix = { version = "1.1.3", features = ["fs"] }
schemars = "1.2"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.150"
serde_path_to_error = "0.1.20"
# The `sha1` algorithm a profile's `checksum:` pin may name.
sha1 = "0.11.0"
# The `sha256` and `sha512` algorithms a profile's `checksum:` pin may name.
sha2 = "0.11.0"
strum = { version = "0.28.0", features = ["derive"] }
# Reads a mitamae plugin archive, and the `git archive` stream a git-sourced plugin is read
# from. Only parsed, never unpacked onto disk, so the `xattr` default feature is not needed.
tar = { version = "0.4.46", default-features = false }
tempfile = "3.25.0"
thiserror = "2.0.18"
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
# Downloads `prepare.apt` keys given by `url`. Verified against the host's trust store
# (platform-verifier) rather than bundled roots, so a key served behind an internal CA works;
# no gzip, since a key is a few kilobytes.
ureq = { version = "3.4.2", default-features = false, features = [
  "rustls",
  "platform-verifier",
] }
url = "2.5.8"
uuid = { version = "1.20.0", features = ["v4"] }
which = "8.0.0"
# The maintained continuation of serde_yaml (dtolnay/serde-yaml, archived —
# RUSTSEC-2024-0370), published as `yaml_serde` by The YAML Organization.
yaml_serde = "0.10.4"

[dev-dependencies]
# The `=` pins below are applied automatically by Renovate's :pinDevDependencies (part of
# config:best-practices; see .renovaterc.json), not a hard requirement of these crates —
# Cargo.lock already pins exact versions, so test runs stay reproducible without them.
jsonschema = "=0.58.6"
proptest = "=1.11.0"
# `process` (for `umask`) is a test-only need: tests/rootfs_mode_test.rs pins that
# `RootfsOps::write_file` lands its mode exactly, which is only observable under a
# umask that would otherwise mask bits off.
rustix = { version = "=1.1.5", features = ["process"] }
