---
# https://taskfile.dev
# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

env:
  # cargo runs the RUSTC_WRAPPER from each crate's source dir, where aqua can't
  # find .aqua/aqua.yaml by upward search; point it at the repo config so the
  # `sccache` command resolves regardless of the working directory.
  AQUA_GLOBAL_CONFIG: '{{.ROOT_DIR}}/.aqua/aqua.yaml'

includes:
  tool: ./tasks/tool.task.yml
  setup: ./tasks/setup.task.yml
  format: ./tasks/format.task.yml
  schema: ./tasks/schema.task.yml
  reviewdog: ./tasks/reviewdog.task.yml
  audit: ./tasks/audit.task.yml
  test: ./tasks/test.task.yml
  coverage: ./tasks/coverage.task.yml
  doc: ./tasks/doc.task.yml
  build: ./tasks/build.task.yml
  release: ./tasks/release.task.yml

tasks:
  default:
    desc: '{{.TASK}}'
    silent: true
    aliases: [all]
    cmds:
    - task: tool
    - task: format
    - task: schema
    - task: reviewdog
    - task: audit:policy
    - task: test
    - task: doc
    - task: build
