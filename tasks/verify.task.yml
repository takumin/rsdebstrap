---
# https://taskfile.dev
# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

# Formal verification. Deliberately absent from the root `task all` pipeline: neither tool is
# aqua-pinnable (both ship as GitHub Releases outside the aqua standard registry, and Verus
# additionally has no stable version scheme to pin to), so requiring them would make the
# ordinary build depend on a manual install. Opt-in locally, informational in CI - see
# .github/workflows/wc-verify.yml and docs/FORMAL_METHODS.md.

tasks:
  default:
    desc: '{{.TASK}}'
    silent: true
    cmds:
    - task: verus
    - task: kani

  # Deductive proofs of the domain layer (verify/verus/resolution.rs). A standalone Verus
  # source file rather than a Cargo crate: vstd and builtin come from the Verus installation,
  # so `verus` is invoked directly and nothing in the rsdebstrap crate graph depends on it.
  verus:
    desc: '{{.TASK}}'
    label: verify:verus
    dir: '{{.ROOT_DIR}}'
    preconditions:
    - sh: command -v verus
      msg: |-
        verus not found on PATH.

        Install a release from https://github.com/verus-lang/verus/releases and add the
        extracted directory itself to PATH - the binary loads vstd.vir and the builtin rlibs
        from alongside itself, so symlinking or copying just the binary will not work.
    cmds:
    - verus --crate-type=lib verify/verus/resolution.rs

  # Bounded model checking of the infrastructure layer. Discovers every #[kani::proof] in the
  # crate; today that is the argv-shaping kernel in src/executor/plan.rs.
  kani:
    desc: '{{.TASK}}'
    label: verify:kani
    dir: '{{.ROOT_DIR}}'
    vars:
      MANIFEST_BACKUP: '{{.ROOT_DIR}}/.task/Cargo.toml.pre-kani'
    preconditions:
    - sh: cargo kani --version
      msg: |-
        cargo-kani not found.

        Install with:
          cargo install --locked kani-verifier
          cargo kani setup

        The setup step downloads the CBMC backend from GitHub Releases, so it needs network
        access to github.com.
    cmds:
    # Kani pins its own nightly (1.93-nightly as of Kani 0.67) and cargo refuses to build a
    # package whose `rust-version` exceeds the active toolchain, so the declared MSRV makes
    # `cargo kani` abort before it verifies anything. The MSRV is a promise about the shipped
    # binary, not a property of the harnesses, so it is dropped for the duration of the run
    # and restored by the `defer` below - which fires on failure too, so an interrupted run
    # cannot leave the manifest edited. `tests/msrv_test.rs` still gates the real thing.
    - mkdir -p '{{.ROOT_DIR}}/.task'
    - cp Cargo.toml '{{.MANIFEST_BACKUP}}'
    - defer: mv '{{.MANIFEST_BACKUP}}' Cargo.toml
    # Filtering the backup into place rather than editing in place: `sed -i` takes a mandatory
    # argument on BSD sed and would break the macOS run.
    - grep -v '^rust-version = ' '{{.MANIFEST_BACKUP}}' > Cargo.toml
    - cargo kani --workspace
