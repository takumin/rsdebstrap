---
# https://taskfile.dev
# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

tasks:
  default:
    desc: '{{.TASK}}'
    silent: true
    cmds:
    - task: aqua:all

  aqua:
    internal: true
    label: aqua:install:{{.TAG}}
    dir: '{{.ROOT_DIR}}'
    sources:
    - .aqua/*.yml
    - .aqua/*.yaml
    - .aqua/**/*.yml
    - .aqua/**/*.yaml
    generates:
    - .task/.done_aqua:install:{{.TAG}}
    cmds:
    - aqua install {{.ARGS}}
    - cmd: touch .task/.done_aqua:install:{{.TAG}}
      silent: true

  aqua:all:
    desc: '{{.TASK}}'
    cmds:
    - task: aqua
      vars:
        TAG: all
        ARGS: -a

  aqua:tag:*:
    desc: '{{.TASK}}'
    cmds:
    - task: aqua
      vars:
        TAG: '{{index .MATCH 0}}'
        ARGS: -t {{index .MATCH 0}}

  # Prunes the aqua root before CI saves it as a cache. A restore that falls
  # back to an older key carries that key's packages forward, so without this
  # every version bump would add to the cache for good.
  aqua:vacuum:
    desc: '{{.TASK}}'
    dir: '{{.ROOT_DIR}}'
    vars:
      # sed rather than rg: rg is itself an aqua package, and running it here
      # would keep it alive in every job's cache.
      REGISTRY_REF:
        sh: sed -n -E 's/^[[:space:]]*ref:[[:space:]]*([^[:space:]#]+).*/\1/p' .aqua/aqua.yaml
      AQUA_ROOT:
        sh: echo "${AQUA_ROOT_DIR:-${XDG_DATA_HOME:-$HOME/.local/share}/aquaproj-aqua}"
    cmds:
    # Running a package refreshes its last-used time, so what the job just ran
    # survives; versions idle for a week go.
    - aqua vacuum -d 7
    # vacuum does not track registries, and each registry bump adds a copy.
    - |-
      test -n '{{.REGISTRY_REF}}'
      registry='{{.AQUA_ROOT}}/registries/github_content/github.com/aquaproj/aqua-registry'
      if [ -d "$registry" ]; then
        find "$registry" -mindepth 1 -maxdepth 1 ! -name '{{.REGISTRY_REF}}' -exec rm -rf {} +
      fi
    # Nor does it track aqua itself or aqua-proxy, which aqua installs under
    # internal/ and every aqua bump adds a copy of (about 27 MB for aqua). The
    # version in use is the one bin/aqua and aqua-proxy link to; drop the rest.
    - |-
      for link in '{{.AQUA_ROOT}}/bin/aqua' '{{.AQUA_ROOT}}/aqua-proxy'; do
        [ -L "$link" ] || continue
        version_dir=$(readlink -f "$link" | sed -n -E 's#^(.*/internal/pkgs/github_release/github\.com/aquaproj/[^/]+/[^/]+)/.+#\1#p')
        [ -d "$version_dir" ] || continue
        find "$(dirname "$version_dir")" -mindepth 1 -maxdepth 1 ! -path "$version_dir" -exec rm -rf {} +
      done

  rustup:toolchain:
    desc: '{{.TASK}}'
    label: rustup:toolchain
    dir: '{{.ROOT_DIR}}'
    # Multiple tasks (rustup:target/component, cargo:fetch) depend on this one;
    # `run: once` makes `rustup toolchain install` run a single time per
    # invocation instead of racing itself (rustup is not concurrency-safe).
    run: once
    # Skip when the pinned toolchain is already installed (e.g. ~/.rustup
    # restored from cache). Inspect the toolchains directory directly instead of
    # calling rustup, which would auto-install the override as a side effect.
    status:
    - ls "${RUSTUP_HOME:-$HOME/.rustup}/toolchains" | rg -q "^$(rg -N -o -r '$1' 'channel\s*=\s*"([^"]+)"' rust-toolchain.toml)-"
    cmds:
    - rustup toolchain install

  rustup:component:*:
    desc: '{{.TASK}}'
    label: rustup:component:{{index .MATCH 0}}
    dir: '{{.ROOT_DIR}}'
    deps:
    - task: rustup:toolchain
    status:
    - rustup component list --installed | rg -q '^{{index .MATCH 0}}'
    cmds:
    - rustup component add '{{index .MATCH 0}}'

  rustup:target:*:
    desc: '{{.TASK}}'
    label: rustup:target:{{index .MATCH 0}}
    dir: '{{.ROOT_DIR}}'
    deps:
    - task: rustup:toolchain
    status:
    - rustup target list --installed | rg -q '^{{index .MATCH 0}}$'
    cmds:
    - rustup target add '{{index .MATCH 0}}'

  cargo:fetch:
    desc: '{{.TASK}}'
    label: cargo:fetch
    dir: '{{.ROOT_DIR}}'
    deps:
    - task: rustup:toolchain
    sources:
    - 'Cargo.lock'
    generates:
    - .task/.done_cargo:fetch
    cmds:
    - cargo fetch --locked
    - cmd: touch .task/.done_cargo:fetch
      silent: true
