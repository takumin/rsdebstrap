---
# https://taskfile.dev
# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

includes:
  setup:
    taskfile: setup.task.yml
    internal: true

tasks:
  default:
    desc: '{{.TASK}}'
    silent: true
    cmds:
    - task: test

  test:
    desc: '{{.TASK}}'
    label: test:workspace
    dir: '{{.ROOT_DIR}}'
    deps:
    - task: setup:test
    sources:
    - 'Cargo.toml'
    - 'Cargo.lock'
    - 'src/**/*.rs'
    - 'tests/**/*.rs'
    # Fingerprint the task's own definition and the pinned toolchain so editing
    # this task's commands or bumping rust-toolchain.toml re-runs it locally
    # instead of being skipped on a stale .task/.done_* marker (see #764).
    - 'tasks/test.task.yml'
    - 'rust-toolchain.toml'
    generates:
    - .task/.done_{{.TASK}}
    cmds:
    - cargo test --frozen --workspace
    - cmd: touch .task/.done_{{.TASK}}
      silent: true

  non_root:
    desc: '{{.TASK}}'
    label: test:non_root
    dir: '{{.ROOT_DIR}}'
    deps:
    - task: setup:test
    cmds:
    # Two of the #[ignore]d tests assert permission-denied I/O rendering by making a
    # path unreadable/unwritable with chmod; as root those bits are bypassed, so the
    # operation succeeds and the assertion fails. Run them only as a non-root user.
    #
    # This also picks up tests/privileged_helper_test.rs, which needs passwordless
    # sudo. Those skip themselves when it is unavailable, so no extra gating here.
    - cmd: |-
        if [ "$(id -u)" -eq 0 ]; then
          echo 'skipping #[ignore]d permission tests: they require a non-root user'
        else
          cargo test --frozen --workspace -- --ignored
        fi
      silent: true
